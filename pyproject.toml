[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyhelm-uae-compliance-mapper"
version = "0.1.0"
description = "API-first control crosswalk for UAE and international cybersecurity frameworks"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cyhelm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
